spring.application.name=empleados-api
server.port=8083

# API Key requerida en el encabezado X-API-KEY para acceder a /api/**
# Se puede sobrescribir con la variable de entorno API_KEY
api.key=${API_KEY:lab7-empleados-2026}

# Permite enviar el estado en minusculas o mayusculas (activo / ACTIVO)
spring.jackson.mapper.accept-case-insensitive-enums=true
